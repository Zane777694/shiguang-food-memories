name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The legacy lockfiles in this project contain invalid bytes. Install from
      # package.json without reading or rewriting either lockfile.
      - run: npm install --no-package-lock --legacy-peer-deps
      - name: Prepare APK download
        shell: bash
        run: |
          mkdir -p public/downloads
          curl --fail --location --retry 3 \
            https://shiguang-food-memories.zane777694.chatgpt.site/downloads/shiguang.part1 \
            --output public/downloads/shiguang.part1
          curl --fail --location --retry 3 \
            https://shiguang-food-memories.zane777694.chatgpt.site/downloads/shiguang.part2 \
            --output public/downloads/shiguang.part2
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
